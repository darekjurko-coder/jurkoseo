name: JURKO PDF import
on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * 0'
permissions:
  contents: read
concurrency:
  group: jurko-pdf-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check private Google Drive authorization
        id: auth
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ] || [ -z "$GOOGLE_REFRESH_TOKEN" ]; then
            echo "Drive authorization is not configured. Nothing will be downloaded or uploaded."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.auth.outputs.ready == 'true'
        run: pip install -r pdf-import/requirements.txt
      - name: Discover official catalogue PDF links
        if: steps.auth.outputs.ready == 'true'
        working-directory: pdf-import
        run: python discover.py
      - name: Download, validate and upload
        if: steps.auth.outputs.ready == 'true'
        working-directory: pdf-import
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python import_pdf.py
      - name: Archive audit CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jurko-pdf-report
          path: |
            pdf-import/report.csv
            pdf-import/discovered.csv
            pdf-import/discovery_errors.csv
          if-no-files-found: ignore
