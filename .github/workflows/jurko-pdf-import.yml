name: JURKO PDF import
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r pdf-import/requirements.txt
      - name: Download validate upload
        working-directory: pdf-import
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python import_pdf.py
      - name: Archive audit CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jurko-pdf-report
          path: pdf-import/report.csv
